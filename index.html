<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Calvin Chang — photographs and things I build." />
    <title>Calvin Chang</title>

    <!-- Display face. Courier Prime is self-hosted from /public/fonts.
         To drop this third-party request later: npm i @fontsource/jost,
         import '@fontsource/jost/400.css' (and 500/700) in main.tsx,
         and delete these three tags. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Handle SPA redirect from 404.html
      const redirect = sessionStorage.getItem('redirect');
      if (redirect) {
        sessionStorage.removeItem('redirect');
        history.replaceState(null, '', redirect);
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
